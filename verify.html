<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد البريد | NOIR</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html">NOIR<span>.</span></a><a href="index.html">العودة للمتجر ←</a></header><main class="auth-wrap"><section class="auth-card"><div class="verify-icon">✉</div><p class="eyebrow">ONE LAST STEP</p><h1>تأكيد بريدك</h1><p class="auth-sub">أدخل رمز التحقق المكوّن من 6 أرقام الذي أرسلناه إلى بريدك.</p><form id="verifyForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required placeholder="name@example.com"><label for="code">رمز التحقق</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><button class="button button-light auth-submit">تأكيد البريد ←</button><p class="form-message" id="formMessage"></p></form><p class="auth-foot"><a href="register.html">العودة لإنشاء الحساب</a></p></section></main><script src="auth.js"></script></body></html>
